version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env.production
    environment:
      - NODE_ENV=production

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:4000
    ports:
      - "80:80"
    depends_on:
      - backend
